<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899"/>
      <stop offset="1" stop-color="#9D174D"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9D174D" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- a price tag: an offer is the product wearing a price, which is exactly
       what a tag is. The hole is punched with the background, so the tag reads
       as one piece of card rather than two shapes. -->
  <g filter="url(#sh)" transform="rotate(-38 256 256)">
    <path d="M256 92 L400 92 A28 28 0 0 1 428 120 L428 264 A28 28 0 0 1 419.8 283.8 L275.8 427.8 A28 28 0 0 1 236.2 427.8 L92.2 283.8 A28 28 0 0 1 92.2 244.2 L236.2 100.2 A28 28 0 0 1 256 92 Z" fill="#FFFFFF"/>
  </g>
  <circle cx="330" cy="182" r="34" fill="url(#bg)"/>
</svg>
